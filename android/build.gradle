group = 'dev.bletide'
version = '0.0.1'

apply plugin: 'com.android.library'

android {
    namespace 'dev.bletide'
    compileSdk 36
    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


configurations {
    mockitoAgent
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    mockitoAgent('org.mockito:mockito-core:5.24.0') { transitive = false }
}
tasks.withType(Test).configureEach {
    // Resolve the development agent only when a JVM test is executed.
    jvmArgumentProviders.add({
        ["-javaagent:${configurations.mockitoAgent.singleFile}"]
    } as org.gradle.process.CommandLineArgumentProvider)
}
